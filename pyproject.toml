[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xband-batch"
version = "0.1.0"
description = "Batch orchestration for X-band NGSO interference analysis (scaffold)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
word = ["python-docx>=1.1"]
pdf = ["pdfplumber>=0.11"]
dev = ["pytest>=8.0"]

[project.scripts]
xband-batch = "xband_batch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
